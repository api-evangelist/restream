specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Restream
providerId: restream
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Live Streaming
  - Multistreaming
description: FOCUS-aligned FinOps for Restream. Restream is sold as a tiered SaaS subscription with optional
  Clips add-on packs and per-seat charges on the Business tier. There is no per-API-request meter; spend
  scales with the subscription tier and add-on packs.
sources:
  - https://restream.io/pricing
  - https://developers.restream.io/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Restream, Inc.
serviceCategory: Live Streaming
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
focusColumns:
  ServiceName: Restream
  ServiceCategory: Live Streaming
  ProviderName: Restream
  PublisherName: Restream, Inc.
  InvoiceIssuerName: Restream, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: subscription_tier
    unit: month
    aggregation: max
    dimensions:
      - tier
  - name: team_seats
    unit: seat
    aggregation: sum
  - name: clips_addon
    unit: clip
    aggregation: sum
    dimensions:
      - tier
  - name: simultaneous_channels
    unit: channel
    aggregation: max
    dimensions:
      - tier
principles:
  - name: Visibility
    description: Visibility comes from the Restream account billing page (subscription, team seats, Clips
      add-on). There is no usage-API export; surface the billing page to finance and the team owner.
  - name: Allocation
    description: Allocate the subscription and Clips add-on to the production team or show that uses
      the workspace. On Business, allocate per team-workspace seat.
  - name: Optimization
    description: Optimize by tier-fit — match the simultaneous-channel cap to actual destinations used,
      drop unused team seats on Business, and size Clips packs to actual clip volume rather than buying
      headroom.
  - name: Accountability
    description: Owner is the production / broadcast lead who controls the Restream workspace and selects
      the subscription tier.
notes: Tiered SaaS subscription with seat and Clips add-ons; no per-request meter exists. Generic
  per-call FOCUS columns and meters removed.
