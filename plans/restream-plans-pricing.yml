description: Restream sells a tiered live-multistreaming SaaS subscription. Tiers gate the number of
  simultaneous destination channels, branding, recording quality, dual-format streaming, embedded-player
  capacity, and team seats. The Restream developer API (channels, events, chat, streaming updates) is
  available to authenticated Restream users; access scales with the underlying subscription. Annual prices
  shown below are the published billed-annually rates.
sources:
  - https://restream.io/pricing
  - https://developers.restream.io/
plans:
