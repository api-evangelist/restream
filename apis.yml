- aid: restream:restream-chat-api
  name: Restream Chat API
  description: >-
    WebSocket API for accessing and managing Restream Chat. Receive real-time chat messages from all connected
    streaming platforms (Twitch, YouTube, Facebook, Discord, LinkedIn, DLive) in a unified event stream.
    Supports reply and relay actions.
  humanURL: https://developers.restream.io/chat/getting-started
