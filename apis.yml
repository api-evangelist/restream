  name: Restream Streaming Updates API
  description: >-
    WebSocket API for real-time streaming status updates. Connect to wss://streaming.api.restream.io/ws
    with an OAuth access token to receive incoming and outgoing stream events, platform status updates,
    and viewer counts in real time.
  humanURL: https://developers.restream.io/private-api/streaming-updates
