aid: restream
name: Restream
description: >-
  Restream is a multistreaming platform that enables content creators and businesses to simultaneously broadcast live
  video to 30+ platforms including YouTube, Twitch, Facebook, LinkedIn, and more. The platform offers REST APIs and
  WebSocket connections for managing streams, channels, events, and chat.
